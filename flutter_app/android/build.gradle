buildscript {
    ext.kotlin_version = '1.9.24'
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.6.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
    afterEvaluate { project ->
        if (project.hasProperty('android')) {
            project.android {
                if (namespace == null) {
                    namespace = project.group ?: "com.sentinelpro.app.${project.name.replaceAll(/[:\-]/, '.')}"
                }
                compileSdk = 35
            }
        }
    }
}
subprojects {
    project.evaluationDependsOn(':app')
}

subprojects {
    // This block is redundant now with the one above, but kept for namespace fallback
    def setNamespace = { p ->
        if (p.extensions.findByName('android') != null) {
            if (p.android.namespace == null) {
                p.android.namespace = p.group ?: "com.sentinelpro.app.${p.name.replaceAll(/[:\-]/, '.')}"
            }
        }
    }
    if (project.state.executed) {
        setNamespace(project)
    } else {
        project.afterEvaluate { p ->
            setNamespace(p)
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
